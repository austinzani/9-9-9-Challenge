# Cloudflare Tunnel ingress for the Pi-hosted challenge app.
#
# This repo expects the 9-9-9 API + static frontend to listen on port 8001 so it
# can coexist with the existing zani-pi service on 8000.
#
# If you reuse the Pi's existing Cloudflare tunnel, merge the ingress rules below
# into ~/.cloudflared/config.yml instead of running a second tunnel service.
# If you create a dedicated tunnel for the challenge, place its credential file at
# /home/austinzani/.cloudflared/999-challenge.json and enable 999-tunnel.service.
tunnel: 999-challenge
credentials-file: /home/austinzani/.cloudflared/999-challenge.json

ingress:
  - hostname: 999.austinzani.dev
    path: /admin*
    service: http_status:404
  - hostname: 999.austinzani.dev
    path: /api/admin*
    service: http_status:404
  - hostname: 999.austinzani.dev
    service: http://localhost:8001
  - hostname: 999-api.austinzani.dev
    path: /admin*
    service: http_status:404
  - hostname: 999-api.austinzani.dev
    path: /api/admin*
    service: http_status:404
  - hostname: 999-api.austinzani.dev
    service: http://localhost:8001
  - service: http_status:404
